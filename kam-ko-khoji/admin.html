<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Kam Ko Khoji PL</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3">
<style>
  .admin{max-width:1100px;margin:0 auto;padding:2rem clamp(1rem,4vw,2rem)}
  .login{max-width:380px;margin:3rem auto}
  .tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 1.4rem}
  .row{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:1rem 1.2rem;margin-bottom:.9rem}
  .row h3{margin:0 0 .2rem;font-size:1.15rem}
  .row .meta{color:var(--muted);font-size:.9rem;margin:0 0 .5rem}
  .row .desc{white-space:pre-line;font-size:.95rem;margin:.4rem 0 .7rem}
  .row .acts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
  .row .btn{padding:.3rem .9rem;font-size:.9rem;border-width:2px}
  .btn-ok{background:var(--green);color:#fff;border-color:var(--green)}
  .btn-no{background:#fff;color:var(--red);border-color:var(--red)}
  .private{background:var(--yellow-soft);border-radius:8px;padding:.4rem .7rem;font-size:.92rem;margin:.4rem 0}
  .status{font-size:.8rem;font-weight:700;border-radius:6px;padding:.05rem .5rem;background:#eee}
  .admin-top{display:flex;justify-content:space-between;align-items:center;gap:1rem}
  select.inline{font:inherit;font-size:.9rem;padding:.25rem .5rem;border:2px solid var(--ink);border-radius:999px}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><span class="brand-ne">काम को खोजी</span><span class="brand-pl">ADMIN</span></a>
  <button class="btn btn-dark btn-sm" id="logoutBtn" hidden style="margin-left:auto">Log out</button>
</header>

<main class="admin">
  <form id="loginForm" class="card form login" hidden>
    <h2 style="margin:0">Admin login</h2>
    <label>Email <input name="email" type="email" required autocomplete="username"></label>
    <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-dark" type="submit">Log in</button>
  </form>

  <p id="notConfigured" class="empty" hidden>Supabase is not connected yet. Fill in <code>config.js</code> first (see README).</p>

  <section id="panel" hidden>
    <div class="admin-top"><h2 style="margin:0">Dashboard</h2><button class="btn btn-outline btn-sm" id="refreshBtn">Refresh</button></div>
    <div class="tabs" id="tabs">
      <button class="chip" data-tab="pending" aria-pressed="true">Pending jobs <b id="cPending">0</b></button>
      <button class="chip" data-tab="approved" aria-pressed="false">Live jobs <b id="cApproved">0</b></button>
      <button class="chip" data-tab="closed" aria-pressed="false">Closed / rejected <b id="cClosed">0</b></button>
      <button class="chip" data-tab="apps" aria-pressed="false">Applications <b id="cApps">0</b></button>
    </div>
    <div id="list"></div>
  </section>
</main>

<div id="toast" class="toast" role="status"></div>
<script src="config.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js?v=3"></script>
</body>
</html>
